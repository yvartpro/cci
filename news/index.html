<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/cci/">
    <meta name="description"
        content="Actualités et nouvelles du Centre Communautaire d'Iteba - Restez informé de nos activités et événements à Rumonge.">
    <!-- Favicons & SEO -->
    <link rel="icon" href="/cci/public/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/cci/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/cci/public/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/cci/public/icon-512.png">
    <link rel="manifest" href="/cci/public/manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CCI Rumonge">
    <meta property="og:image" content="/cci/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>News - CCI Rumonge | Centre Communautaire d'Iteba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-primary-blue: #1e40af;
            --color-primary-green: #059669;
            --color-accent-amber: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100">
    <header id="header" class="sticky top-0 z-50"></header>
    <main>

        <section
            class="relative min-h-[60vh] flex items-center overflow-hidden bg-gradient-to-br from-blue-900 via-purple-900 to-emerald-900">
            <div class="absolute inset-0 z-0">
                <img id="news-image" alt="" class="w-full h-full object-cover opacity-20">
            </div>

            <div class="relative z-10 max-w-7xl mx-auto px-6 py-24 text-center">
                <h1 class="text-5xl md:text-6xl font-black text-white mb-6 leading-tight">
                    Actualités & Événements
                </h1>
                <p class="text-xl md:text-2xl text-blue-100 max-w-3xl mx-auto font-medium">
                    Restez informé de nos dernières activités et réalisations
                </p>
            </div>
        </section>

        <section class="py-24 bg-white">
            <div class="max-w-7xl mx-auto px-6">
                <div id="posts" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
                </div>

                <div class="text-center mt-16">
                    <button
                        class="px-8 py-4 bg-slate-100 text-slate-900 font-bold rounded-2xl hover:bg-slate-200 transition-all uppercase tracking-widest text-sm">
                        Charger Plus d'Articles
                    </button>
                </div>
            </div>
        </section>

        <section class="py-24 bg-gradient-to-br from-blue-900 to-emerald-900">
            <div class="max-w-4xl mx-auto px-6 text-center">
                <h2 class="text-4xl font-black text-white mb-6">Restez Informé</h2>
                <p class="text-xl text-blue-100 mb-8">
                    Inscrivez-vous à notre newsletter pour recevoir nos dernières actualités
                </p>
                <form class="flex flex-col sm:flex-row gap-4 max-w-2xl mx-auto">
                    <input type="email" placeholder="Votre adresse email"
                        class="flex-grow px-6 py-4 rounded-2xl text-slate-900 font-medium focus:outline-none focus:ring-4 focus:ring-blue-300">
                    <button type="submit"
                        class="px-8 py-4 bg-white text-blue-900 font-black rounded-2xl shadow-xl hover:shadow-2xl transition-all hover:scale-105 uppercase tracking-widest text-sm">
                        S'inscrire
                    </button>
                </form>
            </div>
        </section>

        <div id="footer"></div>
    </main>

    <script type="module">
        import { posts as allPosts } from './data/posts-data.js';
        import { formatDate } from './utils.js';
        import { loadPosts, loadComponent, initMobileMenu } from './component/script.js';
        import { files } from '/cci/route.js'

        const init = async () => {
            const news_image = files.find(f => f.use_as === 'news');
            const newsImage = document.getElementById("news-image");
            newsImage.src = news_image.url;
            await Promise.all([
                loadComponent("#header", "./header.html"),
                loadComponent("#footer", "./footer.html")
            ]);

            await loadPosts("#posts", allPosts);
            initMobileMenu();
        };

        init();
    </script>
</body>

</html>
